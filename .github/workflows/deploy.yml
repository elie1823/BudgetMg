name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

env:
  ECR_REGISTRY: 729706797296.dkr.ecr.eu-west-3.amazonaws.com
  ECR_REPOSITORY: budgetmg

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        run: |
          docker build \
            --build-arg VITE_SUPABASE_URL="${{ secrets.VITE_SUPABASE_URL }}" \
            --build-arg VITE_SUPABASE_ANON_KEY="${{ secrets.VITE_SUPABASE_ANON_KEY }}" \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:latest \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }} .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 10m
          script: |
            set -e
            aws ecr get-login-password --region eu-west-3 | docker login --username AWS --password-stdin 729706797296.dkr.ecr.eu-west-3.amazonaws.com
            docker pull 729706797296.dkr.ecr.eu-west-3.amazonaws.com/budgetmg:latest
            docker rm -f budgetmg || true
            docker run -d --name budgetmg --restart unless-stopped \
              -p 80:80 -p 443:443 \
              -v ~/BudgetMg/nginx.conf:/etc/nginx/conf.d/default.conf:ro \
              -v /etc/letsencrypt:/etc/letsencrypt:ro \
              729706797296.dkr.ecr.eu-west-3.amazonaws.com/budgetmg:latest
            docker image prune -f
